<router-outlet />

<p>Nome Completo: {{ nome() }}</p>

<div>
  <button type="button" (click)="alternar(1)">Primeiro nome</button>
  <button type="button" (click)="alternar(2)">Nome completo</button>
</div>

<hr>
<div>
  Tamanho 300 (R$ {{ preco300 }})
  <input
    type="number"
    [value]="quantidade300()"
    (input)="atualizarQuantidade300($event)"
    min="0"
  />
</div>

<div>
  Tamanho 500 (R$ {{ preco500 }})
  <input
    type="number"
    [value]="quantidade500()"
    (input)="atualizarQuantidade500($event)"
    min="0"
  />
</div>

<h2>Total a Pagar: R$ {{ total() }}</h2>
