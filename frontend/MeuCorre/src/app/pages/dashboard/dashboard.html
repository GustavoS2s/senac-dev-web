<!DOCTYPE html>
<html lang="pt-BR">

<head>

<body>

            <div class="col-md-6">
                <div class="caixa-amarela-principal">
                    <p>**COL-6**</p>
                    <div class="row">
                        <div class="col-3">

                        </div>

                            <div class="caixa-interna">COL-3</div>
                        </div>
